# Builds everything (Chipmunk and Rapier physics DLLs, the engine mod, the bench mod) on Windows and packages the mod
# (scripts\package.ps1). A pushed tag v<version> sets that version (scripts\set-version.ps1) and publishes a GitHub
# release with both packages; ModPackage.zip is the asset TABModLoader's auto-update installs.
#
# Runs on release tags and by hand (Actions tab, "Run workflow"). A push to main runs it only when the Rapier build
# inputs change: tag runs can restore caches made on main but not those of other tags, so this keeps the Rapier cache
# warm for the next release.
name: build

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'native/rapier/**'
      - 'scripts/build.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # rapier2d_ffi builds (three CPU levels, each about 10 minutes from scratch). build.ps1 reuses a build whose stamp
      # (Rapier commit, toolchain, options, patches) matches and rebuilds the rest, so an older cache is safe to restore.
      - name: Rapier cache
        uses: actions/cache@v4
        with:
          path: |
            native\out\rapier-sdk
            native\out\rapier-sdk-avx2
            native\out\rapier-sdk-avx512
          key: rapier-${{ hashFiles('native/rapier/*.patch', 'scripts/build.ps1') }}
          restore-keys: rapier-

      # crates for a Rapier rebuild
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
          key: cargo-${{ hashFiles('scripts/build.ps1') }}
          restore-keys: cargo-

      - name: TABModLoader references cache
        uses: actions/cache@v4
        with:
          path: refs
          key: refs-${{ hashFiles('scripts/setup.ps1') }}

      - name: DXVK cache
        uses: actions/cache@v4
        with:
          path: native\out\dxvk
          key: dxvk-${{ hashFiles('scripts/lib/dxvk.ps1') }}

      - name: Build references (TABModLoader)
        run: .\scripts\setup.ps1 -NoPatch

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\scripts\set-version.ps1 -Version $env:GITHUB_REF_NAME

      # the three Rapier builds run side by side inside build.ps1
      - name: Build
        run: |
          try { .\scripts\build.ps1 -Target chipmunk,harness,rapier,mod,bench }
          catch { Write-Host "::error title=build.ps1::$($_.Exception.Message) ($($_.InvocationInfo.PositionMessage -replace '\r?\n', '%0A'))"; throw }

      # on failure, the end of each build log as an annotation (shown on the run page)
      - name: Build logs
        if: failure()
        run: |
          foreach ($f in Get-ChildItem native\out, native\out\rapier, mod\out, bench\out -Filter *.log -ErrorAction SilentlyContinue) {
            $tail = (Get-Content $f.FullName -Tail 25 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=$($f.Name)::$tail"
          }

      - name: Package
        run: .\scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TABPerf
          path: |
            dist/TABPerf-*.zip
            dist/ModPackage.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist\TABPerf-$env:GITHUB_REF_NAME.zip"
          gh release create $env:GITHUB_REF_NAME $zip dist\ModPackage.zip --title "TABPerf $env:GITHUB_REF_NAME" --notes-file .github\release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
