# Builds everything (Chipmunk and Rapier physics DLLs, the engine mod, the bench mod) on Windows and packages the mod
# (scripts\package.ps1). A pushed tag v<version> sets that version (scripts\set-version.ps1) and publishes a GitHub
# release with both packages; ModPackage.zip is the asset TABModLoader's auto-update installs.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: cargo-${{ hashFiles('native/rapier/*.patch', 'scripts/build.ps1') }}
          restore-keys: cargo-

      - name: Build references (TABModLoader)
        run: .\scripts\setup.ps1 -NoPatch

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\scripts\set-version.ps1 -Version $env:GITHUB_REF_NAME

      - name: Build
        run: |
          try { .\scripts\build.ps1 -Target chipmunk,harness,rapier,mod,bench }
          catch { Write-Host "::error title=build.ps1::$($_.Exception.Message) ($($_.InvocationInfo.PositionMessage -replace '\r?\n', '%0A'))"; throw }

      # on failure, the end of each build log as an annotation (shown on the run page)
      - name: Build logs
        if: failure()
        run: |
          foreach ($f in Get-ChildItem native\out, mod\out, bench\out -Filter *.log -ErrorAction SilentlyContinue) {
            $tail = (Get-Content $f.FullName -Tail 25 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=$($f.Name)::$tail"
          }

      - name: Package
        run: .\scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TABPerf
          path: |
            dist/TABPerf-*.zip
            dist/ModPackage.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist\TABPerf-$env:GITHUB_REF_NAME.zip"
          gh release create $env:GITHUB_REF_NAME $zip dist\ModPackage.zip --title "TABPerf $env:GITHUB_REF_NAME" --notes-file .github\release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
