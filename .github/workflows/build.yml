# Builds everything (Chipmunk and Rapier physics DLLs, the engine mod, the bench mod) on Windows and packages the mod
# (scripts\package.ps1). A pushed tag v<version> also publishes a GitHub release with the package; the tag must match
# "Version" in mod/ModInfos.json.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: cargo-${{ hashFiles('native/rapier/*.patch', 'scripts/build.ps1') }}
          restore-keys: cargo-

      - name: Build references (TABModLoader)
        run: .\scripts\setup.ps1 -NoPatch

      - name: Build
        run: .\scripts\build.ps1 -Target chipmunk,harness,rapier,mod,bench

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content mod\ModInfos.json -Raw | ConvertFrom-Json).Version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match mod/ModInfos.json Version $v" }

      - name: Package
        run: .\scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TABPerf
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist\TABPerf-$env:GITHUB_REF_NAME.zip"
          gh release create $env:GITHUB_REF_NAME $zip --title "TABPerf $env:GITHUB_REF_NAME" --notes-file .github\release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
